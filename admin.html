<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11100d"><title>Painel | Point dos Pastéis</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#11100d;--panel:#1b1914;--line:#ffffff1c;--gold:#ffc928;--cream:#f8f3e8;--muted:#aaa397}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#38290d,transparent 60%),var(--bg);color:var(--cream);font:15px 'DM Sans',sans-serif;min-height:100vh}.wrap{width:min(1160px,calc(100% - 36px));margin:auto}header{border-bottom:1px solid var(--line);background:#11100de8;position:sticky;top:0;z-index:2;backdrop-filter:blur(14px)}.head{height:76px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover}.brand small{display:block;color:var(--muted);font-size:.68rem;letter-spacing:.12em}.btn{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:#ffffff0a;color:var(--cream);font:700 .85rem 'DM Sans';text-decoration:none;cursor:pointer}.btn:hover{border-color:var(--gold)}.gold{background:var(--gold);border-color:var(--gold);color:#19150a}.hidden{display:none!important}main{padding:38px 0 70px}.eyebrow{font-weight:800;letter-spacing:.16em;color:var(--gold);font-size:.7rem;text-transform:uppercase}h1{font:600 clamp(2rem,5vw,3rem)/1.05 Oswald,sans-serif;text-transform:uppercase;margin:8px 0 25px}.notice,.login,.stat,.toolbar,.order{border:1px solid var(--line);border-radius:16px;background:var(--panel)}.notice{padding:16px;margin:15px 0;color:#e9d89e;line-height:1.6}.login{max-width:420px;margin:55px auto;padding:25px}.login h2{font:600 1.8rem Oswald;margin:8px 0}.login p{color:var(--muted);font-size:.88rem;line-height:1.5}.login label{display:block;margin:14px 0 6px;font-size:.82rem;font-weight:700}.login input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#11100d;color:var(--cream);font:inherit}.login button{width:100%;margin-top:16px}.error{color:#ff9b8f!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat{padding:16px 18px}.stat span{display:block;color:var(--muted);font-size:.8rem}.stat strong{display:block;font:600 1.8rem Oswald;color:var(--gold);margin-top:4px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;margin-bottom:14px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);border-radius:99px;padding:8px 13px;background:transparent;color:var(--muted);cursor:pointer;font-size:.8rem;font-weight:700}.filter.active{background:var(--gold);color:#17140b;border-color:var(--gold)}#orders{display:grid;gap:12px}.order{padding:18px}.order-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.order-id,.order-time{font-size:.76rem;color:var(--muted)}.order h2{font:600 1.35rem Oswald;margin:4px 0}.tag{display:inline-flex;border-radius:99px;padding:6px 10px;background:#ffc92818;color:var(--gold);font-size:.7rem;font-weight:800;text-transform:uppercase;white-space:nowrap}.tag.paid{background:#1dbb681b;color:#52dc91}.order-content{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin:15px 0}.order-content p{margin:5px 0;color:#ded8cc;font-size:.88rem;line-height:1.5}.muted{color:var(--muted)!important}.items{white-space:pre-line}.total{font-weight:800;color:var(--gold)!important;font-size:1rem!important}.order-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:14px}.selects{display:flex;gap:10px;flex-wrap:wrap}select{min-width:190px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#11100d;color:var(--cream);font:inherit}.empty{border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted);line-height:1.6}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar,.order-actions{align-items:stretch;flex-direction:column}.order-content{grid-template-columns:1fr;gap:6px}.selects{display:grid}.selects select{width:100%}.head{height:68px}.head .btn{padding:9px 12px;font-size:.76rem}}
</style></head><body><header><div class="wrap head"><div class="brand"><img src="assets/logo-point.jpeg" alt=""><div>POINT DOS PASTÉIS<small>PAINEL DE PEDIDOS</small></div></div><div><a class="btn" href="index.html">Ver site ↗</a> <button class="btn hidden" id="logout">Sair</button></div></div></header><main class="wrap"><div id="setup" class="notice hidden"></div><section id="login" class="login"><div class="eyebrow">Área da equipe</div><h2>Entrar no painel</h2><p>Use o e-mail e a senha criados para a pastelaria.</p><label for="email">E-mail</label><input id="email" type="email" autocomplete="username"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password"><button class="btn gold" id="login-button">Entrar</button><p id="login-error" class="error" role="status"></p></section><section id="dashboard" class="hidden"><div class="eyebrow">Operação da loja</div><h1>Pedidos recebidos</h1><div class="stats"><div class="stat"><span>Novos</span><strong id="stat-new">0</strong></div><div class="stat"><span>Em preparo</span><strong id="stat-preparing">0</strong></div><div class="stat"><span>Prontos</span><strong id="stat-ready">0</strong></div><div class="stat"><span>A caminho</span><strong id="stat-delivery">0</strong></div></div><div class="toolbar"><div class="filters"><button class="filter active" data-filter="active">Em andamento</button><button class="filter" data-filter="all">Todos</button><button class="filter" data-filter="new">Novos</button></div><button class="btn" id="refresh">Atualizar ↻</button></div><div id="orders"><div class="empty">Carregando pedidos…</div></div></section></main><script src="admin-demo.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(()=>{const c=window.POINT_SUPABASE_CONFIG||{},ready=c.url&&c.anonKey&&!c.url.includes('SEU-PROJETO')&&!c.anonKey.includes('SUA_CHAVE'),setup=document.getElementById('setup');if(!ready){window.startPointDemoAdmin();return}if(!window.supabase){setup.classList.remove('hidden');setup.textContent='Sem conexão para carregar o painel. Verifique a internet e recarregue.';return}const db=window.supabase.createClient(c.url,c.anonKey),login=document.getElementById('login'),dash=document.getElementById('dashboard'),logout=document.getElementById('logout'),ordersEl=document.getElementById('orders');let orders=[],filter='active';const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),names={new:'Novo',preparing:'Preparando',ready:'Pronto',out_for_delivery:'Saiu para entrega',completed:'Concluído',cancelled:'Cancelado'},options=Object.entries(names).map(([v,n])=>`<option value="${v}">${n}</option>`).join('');function session(s){const yes=!!s;login.classList.toggle('hidden',yes);dash.classList.toggle('hidden',!yes);logout.classList.toggle('hidden',!yes);if(yes)load()}async function load(){ordersEl.innerHTML='<div class="empty">Carregando…</div>';const{data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(100);if(error){ordersEl.innerHTML=`<div class="empty">Não foi possível carregar: ${esc(error.message)}</div>`;return}orders=data||[];[['new','stat-new'],['preparing','stat-preparing'],['ready','stat-ready'],['out_for_delivery','stat-delivery']].forEach(([s,id])=>document.getElementById(id).textContent=orders.filter(o=>o.status===s).length);render()}function render(){let a=orders;if(filter==='active')a=orders.filter(o=>!['completed','cancelled'].includes(o.status));if(filter==='new')a=orders.filter(o=>o.status==='new');if(!a.length){ordersEl.innerHTML='<div class="empty">Nenhum pedido nesta lista por enquanto.</div>';return}ordersEl.innerHTML=a.map(o=>{const address=o.fulfillment==='pickup'?'Retirada no estabelecimento':`${esc(o.street)}, ${esc(o.street_number)} — ${esc(o.neighborhood)}`,items=(o.items||[]).map(i=>`${i.qty}x ${esc(i.name)} — ${money(i.price*i.qty)}`).join('\n'),pay={cash:'Dinheiro',pix:'Pix',card:'Cartão (maquininha)'}[o.payment_method]||o.payment_method;return `<article class="order"><div class="order-top"><div><div class="order-id">Pedido ${esc(o.id.slice(0,8).toUpperCase())} · ${new Date(o.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</div><h2>${esc(o.customer_name||'Cliente')}</h2><div class="order-time">${esc(o.customer_phone||'Telefone não informado')}</div></div><span class="tag ${o.payment_status==='confirmed'?'paid':''}">${o.payment_status==='confirmed'?'Pagamento confirmado':'Pagamento pendente'}</span></div><div class="order-content"><div><p class="muted">ITENS</p><p class="items">${items}</p><p class="muted">${address}</p>${o.notes?`<p>Obs.: ${esc(o.notes)}</p>`:''}</div><div><p>Pagamento: <b>${pay}</b>${o.payment_method==='cash'&&o.change_for?' · troco para '+esc(o.change_for):''}</p><p>Subtotal: ${money(o.subtotal)} · Entrega: ${money(o.delivery_fee)}</p><p class="total">Total: ${money(o.total)}</p></div></div><div class="order-actions"><div class="selects"><select data-status="${o.id}" aria-label="Status do pedido">${options.replace(`value="${o.status}"`,`value="${o.status}" selected`)}</select><button class="btn" data-payment="${o.id}">${o.payment_status==='confirmed'?'Desfazer confirmação':'Confirmar pagamento'}</button></div>${o.customer_phone?`<a class="btn" target="_blank" rel="noreferrer" href="https://wa.me/55${esc(o.customer_phone.replace(/\D/g,''))}">WhatsApp ↗</a>`:''}</div></article>`}).join('');ordersEl.querySelectorAll('[data-status]').forEach(x=>x.onchange=()=>update(x.dataset.status,{status:x.value}));ordersEl.querySelectorAll('[data-payment]').forEach(x=>x.onclick=()=>{const o=orders.find(y=>y.id===x.dataset.payment);update(o.id,{payment_status:o.payment_status==='confirmed'?'pending':'confirmed'})})}async function update(id,patch){const{error}=await db.from('orders').update(patch).eq('id',id);if(error)alert('Não foi possível salvar: '+error.message);else load()}document.getElementById('login-button').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});document.getElementById('login-error').textContent=error?.message||''};document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')document.getElementById('login-button').click()};logout.onclick=()=>db.auth.signOut();document.getElementById('refresh').onclick=load;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelector('.filter.active')?.classList.remove('active');b.classList.add('active');filter=b.dataset.filter;render()});db.auth.getSession().then(({data})=>session(data.session));db.auth.onAuthStateChange((_e,s)=>session(s));setInterval(()=>{if(!dash.classList.contains('hidden'))load()},20000)})();
</script></body></html>
